<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아트머그 이전 후기모음</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 0 !important;
      background: transparent;
      overflow-x: hidden;
    }

    .review-wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .review-cover {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .review-detail-wrap {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      overflow: hidden;
      transition:
        grid-template-rows 0.62s cubic-bezier(.22,.75,.30,1),
        opacity 0.34s ease;
    }

    .review-detail-wrap.is-open {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .review-detail-inner {
      min-height: 0;
      overflow: hidden;
    }

    .review-detail {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .review-detail-wrap {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div id="reviewWrap" class="review-wrap">

    <img
      id="reviewCover"
      class="review-cover"
      src="./images/reviews/reviews%201.png"
      alt="아트머그 이전 후기모음"
      draggable="false"
    >

    <div
      id="reviewDetailWrap"
      class="review-detail-wrap"
      aria-hidden="true"
    >
      <div class="review-detail-inner">
        <img
          id="reviewDetail"
          class="review-detail"
          src="./images/reviews/reviews%202.png"
          alt="아트머그 이전 후기 상세"
          draggable="false"
        >
      </div>
    </div>

  </div>

  <script>
    (function () {
      var reviewWrap = document.getElementById('reviewWrap');
      var cover = document.getElementById('reviewCover');
      var detail = document.getElementById('reviewDetail');
      var detailWrap = document.getElementById('reviewDetailWrap');

      if (!reviewWrap || !cover || !detailWrap) {
        return;
      }

      var isOpen = false;
      var motionRaf = null;
      var motionUntil = 0;

      /*
        중요:
        document.scrollHeight는 iframe 자체가 이미 길어진 뒤에는
        줄어들지 않을 수 있으므로 사용하지 않습니다.
        실제 후기 콘텐츠(.review-wrap)의 렌더링 높이만 부모에게 전달합니다.
      */
      function getContentHeight() {
        return Math.max(
          1,
          Math.ceil(reviewWrap.getBoundingClientRect().height)
        );
      }

      function sendHeight() {
        window.parent.postMessage(
          {
            type: 'iroha-old-reviews-height',
            height: getContentHeight()
          },
          '*'
        );
      }

      function syncDuringMotion(duration) {
        if (motionRaf) {
          cancelAnimationFrame(motionRaf);
        }

        motionUntil = performance.now() + duration;

        function tick(now) {
          sendHeight();

          if (now < motionUntil) {
            motionRaf = requestAnimationFrame(tick);
          } else {
            motionRaf = null;
            sendHeight();
          }
        }

        motionRaf = requestAnimationFrame(tick);
      }

      function toggleReviews() {
        isOpen = !isOpen;

        detailWrap.classList.toggle('is-open', isOpen);
        detailWrap.setAttribute(
          'aria-hidden',
          isOpen ? 'false' : 'true'
        );

        /*
          펼칠 때도, 접을 때도 애니메이션 진행 높이를
          매 프레임 부모 iframe에 전달합니다.
        */
        syncDuringMotion(760);
      }

      cover.addEventListener('click', toggleReviews);

      detailWrap.addEventListener('transitionend', function () {
        sendHeight();

        /*
          브라우저 레이아웃 확정 후 한 번 더 보내
          접었을 때 남는 빈 공간을 제거합니다.
        */
        requestAnimationFrame(function () {
          requestAnimationFrame(sendHeight);
        });
      });

      cover.addEventListener('load', sendHeight);

      if (detail) {
        detail.addEventListener('load', function () {
          if (isOpen) {
            sendHeight();
          }
        });
      }

      window.addEventListener('load', function () {
        sendHeight();
        requestAnimationFrame(sendHeight);
        setTimeout(sendHeight, 150);
        setTimeout(sendHeight, 500);
      });

      window.addEventListener('resize', sendHeight);

      if ('ResizeObserver' in window) {
        var resizeObserver = new ResizeObserver(function () {
          sendHeight();
        });
        resizeObserver.observe(reviewWrap);
      }
    })();
  </script>

</body>
</html>
