<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>협업 작가 소개 v4</title>
<style>
@font-face{font-family:'Paperozi';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Paperozi';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}

:root{
  --mint:#76D8D2;
  --mint-deep:#3DB9B1;
  --mint-dark:#299A94;
  --mint-soft:#EFFFFD;
  --blue-soft:#F2FAFF;
  --lav:#F3F0FF;
  --lav-deep:#8172E8;
  --ink:#313E42;
  --sub:#7D8B90;
  --line:#BFEDEA;
  --card-line:rgba(191,237,234,.95);
  --white:#fff;
  --shadow:0 18px 42px rgba(61,185,177,.15);
  --card-shadow:0 12px 26px rgba(61,185,177,.10);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:transparent;
  color:var(--ink);
  font-family:'Paperozi',sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body{padding:30px 14px 42px}

.collab-wrap{
  width:100%;
  max-width:980px;
  margin:0 auto;
}

.collab-section{
  position:relative;
  overflow:hidden;
  border:1.5px solid var(--line);
  border-radius:32px;
  background:
    radial-gradient(circle at 0% 0%,rgba(118,216,210,.26),transparent 34%),
    radial-gradient(circle at 100% 100%,rgba(129,114,232,.14),transparent 32%),
    linear-gradient(135deg,rgba(255,255,255,.98),rgba(247,255,254,.96));
  box-shadow:var(--shadow);
  padding:34px;
}

.collab-section::after{
  content:"";
  position:absolute;
  right:-90px;
  top:-90px;
  width:230px;
  height:230px;
  border-radius:80px;
  transform:rotate(18deg);
  background:rgba(118,216,210,.14);
  pointer-events:none;
}

.collab-head{
  position:relative;
  z-index:1;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
}

.title-box{
  display:flex;
  align-items:flex-start;
  gap:11px;
}

.title-bar{
  width:6px;
  height:28px;
  border-radius:999px;
  background:linear-gradient(180deg,var(--mint),var(--lav-deep));
  flex:0 0 auto;
  margin-top:2px;
}

.kicker{
  display:inline-flex;
  width:max-content;
  margin-bottom:7px;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(118,216,210,.16);
  border:1px solid rgba(118,216,210,.36);
  color:var(--mint-dark);
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em;
}

.collab-title{
  margin:0;
  color:#2D3D41;
  font-size:24px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:-.04em;
}

.collab-desc{
  margin:8px 0 0;
  color:var(--sub);
  font-size:13.5px;
  line-height:1.65;
  word-break:keep-all;
}

.collab-mini{
  flex:0 0 auto;
  padding:9px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(191,237,234,.9);
  color:var(--mint-dark);
  font-size:12px;
  font-weight:700;
  box-shadow:0 8px 18px rgba(61,185,177,.08);
}

.artist-grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.artist-card{
  overflow:hidden;
  border-radius:24px;
  border:1.5px solid var(--card-line);
  background:rgba(255,255,255,.88);
  box-shadow:var(--card-shadow);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.image-strip{height:210px;background:rgba(191,237,234,.65);border-bottom:1px solid rgba(191,237,234,.9)}

.strip-item{position:relative;overflow:hidden;width:100%;height:100%;background:linear-gradient(135deg,rgba(239,255,253,.96),rgba(243,240,255,.88));display:flex;align-items:center;justify-content:center}

.strip-item img{width:100%;height:100%;display:block;object-fit:contain;object-position:center;background:#fff;-webkit-user-drag:none;user-select:none}

.strip-item.placeholder::after{
  content:"이미지 준비중";
  color:var(--mint-dark);
  font-size:12px;
  font-weight:700;
}

.card-body{
  padding:18px 18px 17px;
}

.card-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  margin-bottom:11px;
}

.meta-chip{
  display:inline-flex;
  align-items:center;
  padding:6px 9px;
  border-radius:999px;
  background:rgba(118,216,210,.15);
  border:1px solid rgba(118,216,210,.32);
  color:#3C8580;
  font-size:11.5px;
  font-weight:700;
}

.meta-chip.lav{
  background:var(--lav);
  border-color:rgba(129,114,232,.20);
  color:var(--lav-deep);
}

.artist-name{
  margin:0 0 7px;
  color:#2D3D41;
  font-size:18px;
  line-height:1.3;
  font-weight:700;
  letter-spacing:-.03em;
}

.artist-role{
  margin:0 0 10px;
  color:var(--mint-dark);
  font-size:13px;
  line-height:1.5;
  font-weight:700;
}

.artist-text{
  min-height:67px;
  margin:0;
  color:#68777A;
  font-size:13px;
  line-height:1.72;
  word-break:keep-all;
}

.tag-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:14px 0 15px;
}

.tag{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(242,250,255,.9);
  border:1px solid rgba(191,229,244,.9);
  color:#5C7D8E;
  font-size:11.5px;
  font-weight:700;
}

.action-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-top:13px;
  border-top:1px solid rgba(191,237,234,.75);
}

.artist-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:10px 13px;
  border-radius:999px;
  color:#fff;
  background:linear-gradient(135deg,var(--mint-deep),var(--lav-deep));
  box-shadow:0 9px 18px rgba(61,185,177,.20);
  font-size:12.5px;
  font-weight:700;
  line-height:1;
  text-decoration:none;
  white-space:nowrap;
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}

.artist-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 22px rgba(61,185,177,.26);
  filter:saturate(1.04);
}

.small-note{
  color:var(--sub);
  font-size:11.5px;
  font-weight:700;
  line-height:1.45;
  text-align:right;
}

.notice{
  position:relative;
  z-index:1;
  margin:15px 0 0;
  color:var(--sub);
  font-size:12.5px;
  line-height:1.6;
  text-align:center;
  word-break:keep-all;
}


.empty-card{
  display:flex;
  min-height:394px;
  align-items:center;
  justify-content:center;
  border:1.5px dashed rgba(118,216,210,.72);
  background:
    radial-gradient(circle at 15% 10%,rgba(118,216,210,.20),transparent 34%),
    linear-gradient(135deg,rgba(255,255,255,.78),rgba(239,255,253,.86));
}

.empty-inner{
  width:100%;
  padding:26px 22px;
  text-align:center;
}

.empty-icon{
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  margin:0 auto 14px;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(118,216,210,.24),rgba(129,114,232,.16));
  color:var(--mint-dark);
  font-size:24px;
  font-weight:700;
}

.empty-title{
  margin:0 0 8px;
  color:#2D3D41;
  font-size:17px;
  line-height:1.35;
  font-weight:700;
}

.empty-text{
  margin:0 auto 15px;
  max-width:280px;
  color:var(--sub);
  font-size:13px;
  line-height:1.7;
  word-break:keep-all;
}

.empty-card .tag-row{
  justify-content:center;
  margin:0;
}

@media(max-width:820px){
  .collab-section{padding:26px 18px}
  .collab-head{flex-direction:column;align-items:flex-start}
  .artist-grid{grid-template-columns:1fr}
  .image-strip{height:210px;background:rgba(191,237,234,.65);border-bottom:1px solid rgba(191,237,234,.9)}
  .artist-text{min-height:auto}
}

@media(max-width:520px){
  body{padding:20px 10px 32px}
  .collab-section{border-radius:24px;padding:22px 14px}
  .collab-title{font-size:21px}
  .artist-card{border-radius:20px}
  .image-strip{height:210px;background:rgba(191,237,234,.65);border-bottom:1px solid rgba(191,237,234,.9)}
  .card-body{padding:16px 15px}
  .action-row{align-items:flex-start;flex-direction:column}
  .small-note{text-align:left}
}
</style>
</head>
<body>
<section class="collab-wrap" aria-label="협업 작가 소개">
  <div class="collab-section">
    <div class="collab-head">
      <div class="title-box">
        <div class="title-bar" aria-hidden="true"></div>
        <div>
          <div class="kicker">COLLABORATION ARTIST</div>
          <h1 class="collab-title">협업 작가 소개</h1>
          <p class="collab-desc">
            이로하 작업과 함께 참고하면 좋은 협업 작가님을 소개합니다.<br>
            원화·헤드 디자인이 필요한 경우 작업 방향에 맞춰 함께 확인해주세요.
          </p>
        </div>
      </div>
      <div class="collab-mini">추후 작가 추가 가능</div>
    </div>

    <div class="artist-grid" id="artistGrid"></div>

    <p class="notice">
      ※ 협업 작가 소개는 작업 선택을 돕기 위한 안내이며, 실제 의뢰는 각 작가 페이지의 안내 기준을 따릅니다.
    </p>
  </div>
</section>

<script>
const artists = [
  {
    name: '히루네 작가',
    role: '버츄얼 헤드 / 원화 일러스트 협업 작가',
    chips: ['IROHA PICK', '원화 · 헤드'],
    text: '캐릭터의 얼굴 인상과 분위기를 섬세하게 잡아주는 작가님입니다. 원화 기반 디자인이나 헤드 이미지 참고자료가 필요한 경우 함께 확인하기 좋습니다.',
    tags: ['#버츄얼헤드', '#원화일러스트', '#캐릭터디자인', '#협업가능'],
    link: 'https://artmug.kr/index.php?channel=view&uid=60421',
    images: ['./images/collab/hirune-01.png']
  }
];

const emptyArtistSlots = [
  {
    title: '협업 작가 추가 예정',
    text: '추후 협업 작가가 추가되면 이 영역에 같은 카드 형식으로 표시됩니다.',
    tags: ['#추가예정', '#협업문의']
  }
];

function escapeHtml(value){
  return String(value || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function renderArtists(){
  const grid = document.getElementById('artistGrid');

  const artistCards = artists.map((artist) => {
    const images = (artist.images || []).slice(0, 1);

    return `
      <article class="artist-card">
        <div class="image-strip">
          ${images.map((src, idx) => `
            <div class="strip-item">
              <img src="${escapeHtml(src)}" alt="${escapeHtml(artist.name)} 이미지 ${idx + 1}" loading="${idx === 0 ? 'eager' : 'lazy'}" onerror="this.parentElement.classList.add('placeholder');this.remove();">
            </div>
          `).join('')}
        </div>

        <div class="card-body">
          <div class="card-meta">
            ${(artist.chips || []).map((chip, idx) => `<span class="meta-chip${idx % 2 ? ' lav' : ''}">${escapeHtml(chip)}</span>`).join('')}
          </div>

          <h2 class="artist-name">${escapeHtml(artist.name)}</h2>
          <p class="artist-role">${escapeHtml(artist.role)}</p>
          <p class="artist-text">${escapeHtml(artist.text)}</p>

          <div class="tag-row">
            ${(artist.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
          </div>

          <div class="action-row">
            <a class="artist-btn" href="${escapeHtml(artist.link)}" target="_blank" rel="noopener">작가 페이지 →</a>
            <span class="small-note">세부 금액은 작가 페이지 기준</span>
          </div>
        </div>
      </article>
    `;
  }).join('');

  const emptyCards = emptyArtistSlots.map((slot) => `
    <article class="artist-card empty-card">
      <div class="empty-inner">
        <div class="empty-icon">＋</div>
        <h2 class="empty-title">${escapeHtml(slot.title)}</h2>
        <p class="empty-text">${escapeHtml(slot.text)}</p>
        <div class="tag-row">
          ${(slot.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
        </div>
      </div>
    </article>
  `).join('');

  grid.innerHTML = artistCards + emptyCards;

  sendHeight();
}

function sendHeight(){
  var h = Math.max(
    document.body ? document.body.scrollHeight : 0,
    document.documentElement ? document.documentElement.scrollHeight : 0
  );
  try{
    parent.postMessage({type:'iroha-collab-artist-height',height:h},'*');
  }catch(e){}
}

window.addEventListener('load',function(){
  renderArtists();
  sendHeight();
  setTimeout(sendHeight,150);
  setTimeout(sendHeight,500);
  setTimeout(sendHeight,1200);
});
window.addEventListener('resize',sendHeight);
if(document.fonts && document.fonts.ready){document.fonts.ready.then(sendHeight)}
if('ResizeObserver' in window){
  var ro = new ResizeObserver(sendHeight);
  ro.observe(document.body);
}
</script>
</body>
</html>
