<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아트머그 이전 후기모음</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow-x: hidden;
    }

    .review-wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .review-cover {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .review-detail-wrap {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      overflow: hidden;

      transition:
        grid-template-rows 0.62s cubic-bezier(.22,.75,.30,1),
        opacity 0.34s ease;
    }

    .review-detail-wrap.is-open {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .review-detail-inner {
      min-height: 0;
      overflow: hidden;
    }

    .review-detail {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .review-detail-wrap {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="review-wrap">

    <!-- 처음부터 보이는 클릭용 이미지 -->
    <img
      id="reviewCover"
      class="review-cover"
      src="./images/reviews/reviews%201.png"
      alt="아트머그 이전 후기모음"
      draggable="false"
    >

    <!-- 클릭하면 아래로 펼쳐지는 이미지 -->
    <div
      id="reviewDetailWrap"
      class="review-detail-wrap"
      aria-hidden="true"
    >
      <div class="review-detail-inner">
        <img
          id="reviewDetail"
          class="review-detail"
          src="./images/reviews/reviews%202.png"
          alt="아트머그 이전 후기 상세"
          draggable="false"
        >
      </div>
    </div>

  </div>

  <script>
    (function () {
      var cover = document.getElementById('reviewCover');
      var detailWrap = document.getElementById('reviewDetailWrap');

      if (!cover || !detailWrap) {
        return;
      }

      var isOpen = false;

      function sendHeight() {
        var height = Math.ceil(
          document.documentElement.scrollHeight
        );

        window.parent.postMessage(
          {
            type: 'iroha-old-reviews-height',
            height: height
          },
          '*'
        );
      }

      function syncHeightDuringMotion() {
        [0, 80, 160, 260, 380, 500, 650, 800].forEach(function (delay) {
          setTimeout(sendHeight, delay);
        });
      }

      function toggleReviews() {
        isOpen = !isOpen;

        detailWrap.classList.toggle(
          'is-open',
          isOpen
        );

        detailWrap.setAttribute(
          'aria-hidden',
          isOpen ? 'false' : 'true'
        );

        syncHeightDuringMotion();
      }

      cover.addEventListener(
        'click',
        toggleReviews
      );

      detailWrap.addEventListener(
        'transitionend',
        sendHeight
      );

      window.addEventListener(
        'load',
        function () {
          sendHeight();
          setTimeout(sendHeight, 300);
          setTimeout(sendHeight, 700);
        }
      );

      window.addEventListener(
        'resize',
        sendHeight
      );
    })();
  </script>

</body>
</html>
