<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IROHA 월간 일정 캘린더 v6</title>

<style>
@font-face{
  font-family:'Paperozi';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:'Paperozi';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
  font-weight:700;
  font-display:swap;
}

:root{
  --mint:#76D8D2;
  --mint-deep:#24C6BF;
  --mint-dark:#159A95;

  --pink:#FFD9E9;
  --pink-deep:#ED94BB;

  --available:#4BB8D4;
  --available-soft:#EAF9FD;

  --off:#F2C85B;
  --off-soft:#FFF6D9;

  --today:#FF8A45;
  --today-soft:#FFF0E6;

  --ink:#344444;
  --sub:#7D8B8B;
  --line:rgba(118,216,210,.34);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:transparent;
  color:var(--ink);
  font-family:'Paperozi',sans-serif;
}

body{
  padding:24px 14px 34px;
}

.calendar-wrap{
  width:100%;
  max-width:980px;
  margin:0 auto;
}

.calendar-shell{
  position:relative;
  overflow:hidden;
  padding:28px 30px 30px;
  border:1px solid var(--line);
  border-radius:30px;
  background:
    radial-gradient(circle at 7% 0%,rgba(118,216,210,.25),transparent 32%),
    radial-gradient(circle at 100% 12%,rgba(255,217,233,.42),transparent 35%),
    linear-gradient(135deg,#F8FFFE 0%,#FFF8FB 100%);
  box-shadow:
    0 18px 44px rgba(61,185,177,.13),
    inset 0 0 0 1px rgba(255,255,255,.72);
}

.calendar-head{
  position:relative;
  z-index:1;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}

.calendar-kicker{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 12px;
  border:1px solid rgba(118,216,210,.42);
  border-radius:999px;
  background:rgba(255,255,255,.68);
  color:var(--mint-dark);
  font-size:13px;
  font-weight:700;
}

.calendar-title{
  margin:10px 0 7px;
  color:#263A3A;
  font-size:30px;
  font-weight:700;
  line-height:1.22;
  letter-spacing:-.04em;
}

.calendar-desc{
  margin:0;
  color:var(--sub);
  font-size:14px;
  line-height:1.65;
  word-break:keep-all;
}

.today-btn{
  flex:0 0 auto;
  min-width:78px;
  height:39px;
  padding:0 14px;
  border:1px solid rgba(118,216,210,.46);
  border-radius:14px;
  background:rgba(255,255,255,.78);
  color:var(--mint-dark);
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.month-nav{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:52px minmax(0,1fr) 52px;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.nav-btn{
  width:52px;
  height:46px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:16px;
  background:rgba(255,255,255,.66);
  color:#D291AB;
  font-family:inherit;
  font-size:24px;
  font-weight:700;
  cursor:pointer;
}

.month-label{
  text-align:center;
  color:#342E3B;
  font-size:22px;
  font-weight:700;
  letter-spacing:-.03em;
}

.legend{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}

.legend-chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  height:31px;
  padding:0 11px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:999px;
  background:rgba(255,255,255,.72);
  color:#647171;
  font-size:12px;
  font-weight:700;
}

.legend-dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.legend-dot.today{background:var(--today)}
.legend-dot.available{background:var(--available)}
.legend-dot.closed{background:var(--pink-deep)}
.legend-dot.off{background:var(--off)}

.calendar-box{
  position:relative;
  z-index:1;
  overflow:hidden;
  border:1px solid rgba(118,216,210,.24);
  border-radius:22px;
  background:rgba(255,255,255,.63);
}

.weekday-row{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  border-bottom:1px solid rgba(118,216,210,.22);
  background:rgba(255,255,255,.56);
}

.weekday{
  padding:13px 6px 11px;
  text-align:center;
  color:#91A09F;
  font-size:12px;
  font-weight:700;
}

.weekday:first-child{color:#E67B8D}
.weekday:last-child{color:#7583D8}

.days-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
}

.day-cell{
  position:relative;
  min-height:96px;
  padding:10px 9px 8px;
  border-right:1px solid rgba(118,216,210,.15);
  border-bottom:1px solid rgba(118,216,210,.15);
  background:rgba(255,255,255,.36);
}

.day-cell:nth-child(7n){
  border-right:0;
}

.day-number{
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  margin:0 auto;
  border-radius:10px;
  color:#364848;
  font-size:14px;
  font-weight:700;
  line-height:1;
}

.day-cell.sunday .day-number{color:#E35F72}
.day-cell.saturday .day-number{color:#6575D8}

.day-cell.outside{
  background:rgba(255,255,255,.18);
}

.day-cell.outside .day-number{
  color:#C7CECE;
}

.day-cell.today{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.96),transparent 42%),
    linear-gradient(135deg,rgba(255,236,219,.92),rgba(255,247,239,.92));
  box-shadow:
    inset 0 0 0 2px rgba(255,138,69,.45);
}

.day-cell.today .day-number{
  background:var(--today);
  color:#fff !important;
}

.today-text{
  display:block;
  margin:3px 0 0;
  color:var(--today);
  text-align:center;
  font-size:9px;
  font-weight:700;
  letter-spacing:.06em;
}

.day-status{
  display:flex;
  justify-content:center;
  margin-top:7px;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:44px;
  height:23px;
  padding:0 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}

.status-pill.available{
  background:rgba(75,184,212,.15);
  color:#3B9DB5;
  border:1px solid rgba(75,184,212,.30);
}

.status-pill.closed{
  background:rgba(237,148,187,.19);
  color:#D96792;
  border:1px solid rgba(237,148,187,.34);
}

.status-pill.off{
  background:rgba(242,200,91,.22);
  color:#A77A12;
  border:1px solid rgba(230,190,85,.38);
}

.calendar-note{
  position:relative;
  z-index:1;
  margin:16px 0 0;
  padding:12px 14px;
  border:1px dashed rgba(118,216,210,.42);
  border-radius:17px;
  background:rgba(255,255,255,.54);
  color:#788585;
  font-size:12.5px;
  line-height:1.6;
}

@media(max-width:720px){
  .calendar-shell{padding:23px 18px 24px}
  .calendar-title{font-size:26px}
  .day-cell{min-height:82px;padding:8px 5px 6px}
  .status-pill{min-width:0;height:21px;padding:0 6px;font-size:9px}
}

@media(max-width:520px){
  body{padding:18px 8px 28px}
  .calendar-shell{padding:20px 10px 20px;border-radius:24px}
  .calendar-head{display:block}
  .today-btn{margin-top:13px}
  .month-nav{grid-template-columns:44px minmax(0,1fr) 44px}
  .nav-btn{width:44px;height:42px}
  .month-label{font-size:19px}
  .day-cell{min-height:70px;padding:6px 3px 5px}
  .day-number{width:27px;height:27px;font-size:12px}
  .today-text{font-size:8px}
  .status-pill{padding:0 5px;font-size:8px}
}
</style>
</head>

<body>

<section class="calendar-wrap" aria-label="IROHA 일정 캘린더">
  <div class="calendar-shell">

    <div class="calendar-head">
      <div>
        <div class="calendar-kicker">✦ MONTHLY SCHEDULE</div>
        <h1 class="calendar-title">IROHA 일정 캘린더</h1>
        <p class="calendar-desc">
          월별 예약 및 작업 진행 상태를 한눈에 확인할 수 있습니다.<br>
          세부 일정은 상담 및 자료 확인 후 조정될 수 있습니다.
        </p>
      </div>
    </div>

    <div class="month-nav">
      <button type="button" class="nav-btn" id="prevMonth" aria-label="이전 달">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button type="button" class="nav-btn" id="nextMonth" aria-label="다음 달">›</button>
    </div>

    <div class="legend" aria-label="상태 안내">
      <div class="legend-chip">
        <span class="legend-dot today"></span>
        TODAY
      </div>

      <div class="legend-chip">
        <span class="legend-dot available"></span>
        예약 가능
      </div>

      <div class="legend-chip">
        <span class="legend-dot closed"></span>
        예약 마감
      </div>

      <div class="legend-chip">
        <span class="legend-dot off"></span>
        휴무일
      </div>
    </div>

    <div class="calendar-box">
      <div class="weekday-row">
        <div class="weekday">일</div>
        <div class="weekday">월</div>
        <div class="weekday">화</div>
        <div class="weekday">수</div>
        <div class="weekday">목</div>
        <div class="weekday">금</div>
        <div class="weekday">토</div>
      </div>

      <div class="days-grid" id="daysGrid"></div>
    </div>

    <p class="calendar-note">
      ※ 월별 일정 캘린더는 예약 가능 여부를 빠르게 확인하기 위한 안내용이며, 실제 일정은 신청 내용과 자료 전달 상황에 따라 달라질 수 있습니다.
    </p>

  </div>
</section>

<script>
(function(){

  /*
    일정 상태
    - 2026년 9월 30일까지: 예약 마감
    - 2026년 10월 1일부터: 예약 가능
  */
  var scheduleRanges = [
    {
      start:'2020-01-01',
      end:'2026-09-30',
      type:'closed',
      label:'마감'
    },
    {
      start:'2026-10-01',
      end:'2035-12-31',
      type:'available',
      label:'예약 가능'
    }
  ];

  function pad(value){
    return String(value).padStart(2,'0');
  }

  function toKey(year,month,day){
    return year + '-' + pad(month) + '-' + pad(day);
  }

  function keyToNumber(key){
    return parseInt(key.replace(/-/g,''),10);
  }

  function getStatus(key){
    var keyNumber = keyToNumber(key);

    for(var i=0;i<scheduleRanges.length;i++){
      var item = scheduleRanges[i];

      if(
        keyNumber >= keyToNumber(item.start) &&
        keyNumber <= keyToNumber(item.end)
      ){
        return item;
      }
    }

    return null;
  }

  function getTodayParts(){
    var formatter = new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone:'Asia/Seoul',
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    );

    var parts = formatter.formatToParts(new Date());

    return {
      year:parseInt(parts.find(function(p){return p.type==='year';}).value,10),
      month:parseInt(parts.find(function(p){return p.type==='month';}).value,10),
      day:parseInt(parts.find(function(p){return p.type==='day';}).value,10)
    };
  }

  var today = getTodayParts();
  var viewYear = today.year;
  var viewMonth = today.month;

  var monthLabel = document.getElementById('monthLabel');
  var daysGrid = document.getElementById('daysGrid');

  function buildCell(year,month,day,outside,weekdayIndex){

    var key = toKey(year,month,day);
    var status = getStatus(key);

    var isToday =
      year === today.year &&
      month === today.month &&
      day === today.day;

    var classNames = ['day-cell'];

    if(outside){classNames.push('outside')}
    if(weekdayIndex === 0){classNames.push('sunday')}
    if(weekdayIndex === 6){classNames.push('saturday')}
    if(isToday){classNames.push('today')}

    var html =
      '<div class="' + classNames.join(' ') + '">' +
        '<div class="day-number">' + day + '</div>';

    if(isToday){
      html += '<span class="today-text">TODAY</span>';
    }

    if(status){
      html +=
        '<div class="day-status">' +
          '<span class="status-pill ' + status.type + '">' +
            status.label +
          '</span>' +
        '</div>';
    }

    html += '</div>';

    return html;
  }

  function renderCalendar(){

    monthLabel.textContent =
      viewYear + '년 ' + viewMonth + '월';

    var firstDay =
      new Date(viewYear,viewMonth - 1,1);

    var firstWeekday =
      firstDay.getDay();

    var daysInMonth =
      new Date(viewYear,viewMonth,0).getDate();

    var prevMonthDate =
      new Date(viewYear,viewMonth - 2,1);

    var prevYear =
      prevMonthDate.getFullYear();

    var prevMonth =
      prevMonthDate.getMonth() + 1;

    var prevDays =
      new Date(viewYear,viewMonth - 1,0).getDate();

    var nextMonthDate =
      new Date(viewYear,viewMonth,1);

    var nextYear =
      nextMonthDate.getFullYear();

    var nextMonth =
      nextMonthDate.getMonth() + 1;

    var cells = [];

    for(var index=0;index<42;index++){

      var relative =
        index - firstWeekday + 1;

      if(relative < 1){

        cells.push(
          buildCell(
            prevYear,
            prevMonth,
            prevDays + relative,
            true,
            index % 7
          )
        );

      }else if(relative > daysInMonth){

        cells.push(
          buildCell(
            nextYear,
            nextMonth,
            relative - daysInMonth,
            true,
            index % 7
          )
        );

      }else{

        cells.push(
          buildCell(
            viewYear,
            viewMonth,
            relative,
            false,
            index % 7
          )
        );
      }
    }

    daysGrid.innerHTML = cells.join('');

    sendHeight();
    setTimeout(sendHeight,120);
  }

  document
    .getElementById('prevMonth')
    .addEventListener('click',function(){

      viewMonth -= 1;

      if(viewMonth < 1){
        viewMonth = 12;
        viewYear -= 1;
      }

      renderCalendar();
    });

  document
    .getElementById('nextMonth')
    .addEventListener('click',function(){

      viewMonth += 1;

      if(viewMonth > 12){
        viewMonth = 1;
        viewYear += 1;
      }

      renderCalendar();
    });

  function sendHeight(){

    var height =
      Math.max(
        document.body ? document.body.scrollHeight : 0,
        document.documentElement ? document.documentElement.scrollHeight : 0
      );

    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage(
          {
            type:'iroha-weekly-schedule-height',
            height:height
          },
          '*'
        );
      }
    }catch(error){}
  }

  window.addEventListener('load',function(){
    renderCalendar();
    sendHeight();
    setTimeout(sendHeight,300);
    setTimeout(sendHeight,800);
  });

  window.addEventListener('resize',sendHeight);

  setInterval(function(){

    var newToday = getTodayParts();

    if(
      newToday.year !== today.year ||
      newToday.month !== today.month ||
      newToday.day !== today.day
    ){
      today = newToday;
      renderCalendar();
    }

  },60000);

})();
</script>

</body>
</html>
