<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>아트머그 이전 후기모음</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      width: 100%;
      overflow: hidden;
    }

    .review-wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .review-toggle {
      position: relative;

      width: 100%;
      max-height: 190px;

      overflow: hidden;

      cursor: pointer;

      transition:
        max-height 0.65s cubic-bezier(0.22, 0.75, 0.30, 1);
    }

    .review-toggle img {
      display: block;

      width: 100%;
      height: auto;

      margin: 0 auto;

      border: 0;

      user-select: none;
      -webkit-user-drag: none;
    }

    .review-toggle.is-open {
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="review-wrap">

    <div
      id="reviewToggle"
      class="review-toggle"
      role="button"
      tabindex="0"
      aria-expanded="false"
    >

      <img
        id="reviewImage"
        src="https://artmugfile2.cafe24.com/image/up_img/detail/5/goods_59004/17824449100_Re.jpg"
        alt="아트머그 이전 후기모음"
        draggable="false"
      >

    </div>

  </div>


  <script>
    (function () {

      const CLOSED_HEIGHT = 190;

      const toggle = document.getElementById('reviewToggle');
      const image = document.getElementById('reviewImage');

      let isOpen = false;


      function getFullHeight() {
        return image.getBoundingClientRect().height;
      }


      function sendHeight() {
        const height = Math.ceil(
          document.documentElement.scrollHeight
        );

        window.parent.postMessage(
          {
            type: 'iroha-old-reviews-height',
            height: height
          },
          'https://artmug.kr'
        );
      }


      function openReviews() {

        const fullHeight = getFullHeight();

        toggle.style.maxHeight = fullHeight + 'px';

        toggle.classList.add('is-open');

        toggle.setAttribute(
          'aria-expanded',
          'true'
        );

        isOpen = true;
      }


      function closeReviews() {

        const fullHeight = getFullHeight();

        /*
          현재 높이를 먼저 잡아준 다음
          다음 프레임에서 접힌 높이로 변경해서
          닫힐 때도 자연스럽게 애니메이션됩니다.
        */
        toggle.style.maxHeight = fullHeight + 'px';

        requestAnimationFrame(function () {

          requestAnimationFrame(function () {

            toggle.style.maxHeight =
              CLOSED_HEIGHT + 'px';

          });

        });

        toggle.classList.remove('is-open');

        toggle.setAttribute(
          'aria-expanded',
          'false'
        );

        isOpen = false;
      }


      function toggleReviews() {

        if (isOpen) {
          closeReviews();
        } else {
          openReviews();
        }

      }


      toggle.addEventListener(
        'click',
        toggleReviews
      );


      toggle.addEventListener(
        'keydown',
        function (event) {

          if (
            event.key === 'Enter' ||
            event.key === ' '
          ) {

            event.preventDefault();

            toggleReviews();

          }

        }
      );


      image.addEventListener(
        'load',
        function () {

          toggle.style.maxHeight =
            CLOSED_HEIGHT + 'px';

          sendHeight();

        }
      );


      /*
        열리고 닫히는 동안 iframe 높이도
        자동으로 부모 페이지에 전달합니다.
      */
      if ('ResizeObserver' in window) {

        const observer =
          new ResizeObserver(function () {

            sendHeight();

          });

        observer.observe(document.body);
        observer.observe(toggle);

      }


      toggle.addEventListener(
        'transitionend',
        function () {

          sendHeight();

        }
      );


      window.addEventListener(
        'resize',
        function () {

          if (isOpen) {

            toggle.style.maxHeight =
              getFullHeight() + 'px';

          }

          sendHeight();

        }
      );


      setTimeout(sendHeight, 100);
      setTimeout(sendHeight, 500);
      setTimeout(sendHeight, 1000);

    })();
  </script>

</body>
</html>
